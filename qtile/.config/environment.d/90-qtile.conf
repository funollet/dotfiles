# Read by systemd --user when the manager starts, which is before the X server
# exists. Anything X-specific would only be a guess here, so it belongs in the
# session instead: autostart.sh runs "dbus-update-activation-environment
# --systemd --all" once qtile is up, and that is what gives units their real
# DISPLAY and XAUTHORITY.

# Tell systemd which desktop this is. Load-bearing: every unit
# systemd-xdg-autostart-generator produces gates on this value through
# systemd-xdg-autostart-condition. Kept here as well as in the session because
# the manager starts first.
# Session-side half: installers/roles/xsession/files/50-qtile-desktop.sh.
XDG_CURRENT_DESKTOP=qtile
DESKTOP_SESSION=qtile

# Fixed ssh-agent socket (socket-activated ssh-agent.socket user unit), so
# both systemd --user services (e.g. the ghostty daemon) and login shells
# share one agent.
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket

# The xorg touchpad config is declared in
# mise/.config/mise/conf.d/bootstrap.toml.

- name: install fusuma
  gem:
    name: "{{ item }}"
    state: present
    user_install: true
  loop:
    - fusuma
    - fusuma-plugin-keypress
    - fusuma-plugin-tap
    - fusuma-plugin-sendkey
  tags: [touchpad, fusuma]

# fusuma.service is stowed from the fusuma package and enabled by
# "task systemctl", like every other user unit in this repo.

- name: xorg touchpad config
  copy:
    src: xorg.conf.d/30-touchpad.conf
    dest: /etc/X11/xorg.conf.d/
    owner: root
    group: root
    mode: '0644'
  become: true
  tags: [touchpad]

- name: install fusuma
  gem:
    name: "{{ item }}"
    state: present
    user_install: true
  loop:
    - fusuma
    - fusuma-plugin-keypress
    - fusuma-plugin-tap
    - fusuma-plugin-sendkey
  tags: [touchpad, fusuma]

# fusuma.service is stowed from the fusuma package and enabled by
# "task systemctl", like every other user unit in this repo. This role only
# owns the system-level pieces.

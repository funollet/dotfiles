# The tailscale repo is declared in mise/.config/mise/conf.d/bootstrap.toml.

- name: install tailscale
  ansible.builtin.dnf:
    name: tailscale
    state: present
  become: true
  tags: [tailscale]

- name: enable and start tailscale service
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  become: true
  tags: [tailscale]

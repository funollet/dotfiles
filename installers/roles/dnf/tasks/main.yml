# Third-party repos, RPM Fusion and the workstation repos are declared in
# mise/.config/mise/conf.d/bootstrap.toml and converged by `mise bootstrap`.

- name: remove unwanted packages with dnf
  ansible.builtin.dnf:
    name: "{{ rpm_absent }}"
    state: absent
  become: true
  tags: [rpm, rpm-absent]

- name: install with dnf
  ansible.builtin.dnf:
    name: "{{ rpm }}"
    state: present
  become: true
  tags: [rpm, rpm-present]

- name: dnf prompts default to yes
  community.general.ini_file:
    path: /etc/dnf/dnf.conf
    section: main
    option: defaultyes
    value: 'True'
    mode: '0644'
    backup: false
  become: true
  tags: [rpm, rpm-config]


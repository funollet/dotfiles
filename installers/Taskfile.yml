# https://taskfile.dev

version: "3"

vars:
  ANSIBLE: "ansible-playbook -v install.yml"

tasks:
  default:
    cmds:
      - task --list --sort=none
    silent: true

  ansible:
    desc: Run ansible on the local workstation.
    cmds:
      - "{{.ANSIBLE}} {{.CLI_ARGS}}"

  ansible-tags:
    desc: pick an ansible tag and run with it
    cmds:
      - "{{.ANSIBLE}} {{.CLI_ARGS}} -t {{.TAG}}"
    vars:
      TAG:
        sh: |
          (ls -1 install.yml ; fd '(yml|yaml)'  roles/ ) |
          xargs yq '.[] | select(has("tags")) | .tags' -P --no-doc |
          sed 's/^- //' |
          sort | uniq | fzf --no-multi

  zed:
    desc: Install latest Zed editor system-wide. Multiple versions coexist under /opt.
    vars:
      URL: "https://cloud.zed.dev/releases/stable/latest/download?asset=zed&arch=x86_64&os=linux&source=docs"
      TARBALL: /tmp/zed.tar.gz
      STAGING: /tmp/zed-extract
      VERSION_FILE: /tmp/zed-version
    cmds:
      - test -f {{.TARBALL}} || wget -nv -O {{.TARBALL}} "{{.URL}}"
      - rm -rf {{.STAGING}}
      - mkdir -p {{.STAGING}}
      - tar -xzf {{.TARBALL}} -C {{.STAGING}}
      - |
        set -eu
        VERSION=$({{.STAGING}}/zed.app/bin/zed --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
        DEST=/opt/zed-${VERSION}.app
        sudo rm -rf "${DEST}"
        sudo mv {{.STAGING}}/zed.app "${DEST}"
        echo "$VERSION" > {{.VERSION_FILE}}
      - task: zed-switch
        vars:
          VERSION:
            sh: cat /tmp/zed-version
      - rm -rf {{.STAGING}} {{.VERSION_FILE}}

  zed-switch:
    desc: Switch the active Zed version (fzf picker if VERSION not given).
    vars:
      VERSION: '{{.VERSION | default ""}}'
      STOW_FLAGS: "-d /opt -t /usr/local --ignore='^lib$' --ignore='^libexec$' --ignore='^licenses\\.md$'"
    cmds:
      - |
        set -eu
        VERSION="{{.VERSION}}"
        if [ -z "$VERSION" ]; then
          VERSION=$(ls -1d /opt/zed-*.app 2>/dev/null | sed 's|.*/zed-||;s|\.app$||' | fzf --no-multi)
        fi
        [ -n "$VERSION" ] || { echo "no version selected" >&2; exit 1; }
        [ -d "/opt/zed-${VERSION}.app" ] || { echo "no install at /opt/zed-${VERSION}.app" >&2; exit 1; }
        for old in /opt/zed-*.app; do
          [ -d "$old" ] || continue
          name=$(basename "$old")
          [ "$name" = "zed-${VERSION}.app" ] && continue
          sudo stow {{.STOW_FLAGS}} -D "$name" 2>/dev/null || true
        done
        sudo stow {{.STOW_FLAGS}} -R "zed-${VERSION}.app"

  reboot:
    prompt: Are you sure you want to reboot?
    cmds:
      - sudo systemctl reboot

  update:
    desc: Fedora update.
    cmds:
      - sudo dnf update --downloadonly -y
      - sudo dnf update -y
      - flatpak update -y

  update-kernel:
    cmds:
      - sudo dnf update kernel kernel-modules-extra kernel-devel-matched VirtualBox virtualbox-guest-additions vagrant
      - task: reboot

  upgrade0:
    desc: Fedora upgrade, step 0.
    cmds:
      - sudo dnf install dnf-plugin-system-upgrade
      - sudo dnf upgrade --refresh
      - task: reboot

  # https://docs.fedoraproject.org/en-US/quick-docs/dnf-system-upgrade/
  upgrade1:
    desc: Fedora upgrade, step 1.
    vars:
      NEXT_VERSION:
        sh: "lsb_release -r | cut -f2 | xargs -I{} expr {} + 1"
    cmds:
      - sudo dnf system-upgrade download -y --releasever={{.VERSION | default .NEXT_VERSION}}

  upgrade2:
    desc: Fedora upgrade, step 2.
    cmds:
      - sudo dnf5 offline reboot

  reclaim:
    desc: Reclaim unused space.
    cmds:
      - sudo dnf clean packages
      - sudo dnf system-upgrade clean
      - flatpak uninstall --unused
      - flatpak uninstall --delete-data
      - sudo journalctl --vacuum-time=10d

  kernel-cleanup:
    desc: Remove old kernels.
    vars:
      OLD_KERNELS:
        sh: dnf repoquery --installonly --latest-limit=-1 -q | grep -v "$(uname -r)" | tr '\n' ' ' || true
    cmds:
      - sudo dnf remove {{.OLD_KERNELS}}
    preconditions:
      - sh: test -n "{{.OLD_KERNELS}}"
        msg: No old kernels to remove

  fight-entropy:
    desc: Tidy-up system-wide.
    vars:
      CURRENT_RELEASE:
        sh: lsb_release -sr
    cmds:
      - cmd: echo "Modules from older releases"
        silent: true
      - cmd: ls -1d /lib/modules/* | grep -v ".fc{{.CURRENT_RELEASE}}."
        ignore_error: true
      - cmd: echo
        silent: true
      - cmd: echo "Packages with broken dependencies"
        silent: true
      - sudo dnf repoquery --unsatisfied
      - cmd: echo
        silent: true
      - cmd: echo "Packages with multiple versions installed"
        silent: true
      - sudo dnf repoquery --duplicates
      - cmd: echo
        silent: true
      - cmd: echo "Possibly unused packages"
        silent: true
      - sudo dnf repoquery --extras --exclude=kernel,kernel-\*,kmod-\*,dkms | grep -v ".fc{{.CURRENT_RELEASE}}."
      - cmd: echo
        silent: true

  cleanup-home:
    desc: Safely free disk space under ~
    cmds:
      - cmd: df -h /home
        silent: true
      - task: cleanup-terraform
      - task: cleanup-cache
      - task: cleanup-mise
      - cmd: df -h /home
        silent: true

  cleanup-terraform:
    desc: Delete .terraform and .terragrunt-cache dirs. Restored on next run.
    vars:
      ROOT: '{{.ROOT | default "$HOME/code"}}'
      # --hidden and --no-ignore are both required: the dirs are dotted and
      # gitignored, and fd skips either kind by default.
      # --prune stops the descent at the first match, so a .terraform nested
      # inside a .terragrunt-cache is never listed on its own. Without it the
      # batched rm would delete the parent and then fail on the stale child.
      FD_FLAGS: --type directory --hidden --no-ignore --prune
      PATTERN: '^\.(terraform|terragrunt-cache)$'
    cmds:
      - fd {{.FD_FLAGS}} '{{.PATTERN}}' {{.ROOT}}
      - fd {{.FD_FLAGS}} '{{.PATTERN}}' {{.ROOT}} --exec-batch rm -r --interactive=never

  cleanup-mise:
    desc: Delete mise tool versions no longer referenced by any tracked config.
    cmds:
      - mise ls --prunable
      # --yes is required, not just convenient: mise prompts before
      # uninstalling, and with stdin not a tty it answers no and prunes
      # only the config links, reporting success either way.
      - mise prune --yes

  cleanup-cache:
    desc: Purge regenerable caches under ~/.cache.
    cmds:
      # Tool-native prunes: they know what is still referenced.
      - cmd: uv cache clean
        ignore_error: true
      - cmd: pip cache purge
        ignore_error: true
      - cmd: pre-commit clean
        ignore_error: true
      - cmd: go clean -cache
        ignore_error: true
      # No prune command of their own, rebuilt on next use. Note that
      # ~/.cache/aws holds the jsii package cache, not credentials.
      # No `rm -f`: the -d guard handles a missing dir, so an unexpected
      # path stays an error instead of a silent success.
      - |
        set -eu
        for name in pex pypoetry puppeteer act libdnf5 apt aws; do
          dir="$HOME/.cache/$name"
          test -d "$dir" || continue
          echo "removing $dir"
          rm -r --interactive=never "$dir"
        done
      # Browser caches: a running browser would just write them back.
      - |
        set -eu
        clean_browser_cache() {
          if pgrep -x "$1" >/dev/null; then
            echo "skipping ~/.cache/$2: $1 is still running"
          elif test -d "$HOME/.cache/$2"; then
            echo "removing $HOME/.cache/$2"
            rm -r --interactive=never "$HOME/.cache/$2"
          fi
        }
        clean_browser_cache chrome google-chrome
        clean_browser_cache firefox mozilla

  tweak:
    desc: Post-install config tasks.
    deps:
      - tweak-vbox
      - tweak-firefox
      - tweak-kde

  # Set folder to store Virtualbox machines
  tweak-vbox:
    cmds:
      - VBoxManage setproperty machinefolder /home/jordif/spool/VirtualBox_VMs

  # Minor Firefox tweaks.
  tweak-firefox:
    cmds:
      - test -f ~/.gtkrc-2.0 || touch ~/.gtkrc-2.0
      - sed -i 's/# *gtk-key-theme-name =/gtk-key-theme-name =/' ~/.gtkrc-2.0
      - grep -q 'gtk-key-theme-name =' ~/.gtkrc-2.0 || echo 'gtk-key-theme-name = "Emacs"' >> ~/.gtkrc-2.0
      # Firefox uses kde file manager: requires xdg-desktop-portal-kde
      # Set the app launcher command to: GTK_USE_PORTAL=1 firefox %u

  # KDE tweaks.
  # https://userbase.kde.org/Plasma/Tips
  # 'Meta' does nothing by itself
  tweak-kde:
    cmds:
      - kwriteconfig5 --file ~/.config/kwinrc --group ModifierOnlyShortcuts --key Meta ""
      - qdbus org.kde.KWin /KWin reconfigure

  config-x11:
    desc: Configure xkb system-wide.
    cmds:
      - sudo localectl set-x11-keymap us pc105 "" "compose:caps,ctrl:menu_rctrl,terminate:ctrl_alt_bksp"

  xkb-change:
    desc: Reconfigure xkb on a running X session.
    cmds:
      # Delete previous options.
      - setxkbmap -layout us -option ''
      # Set keyboard layout.
      # compose:caps          caps key is compose key
      # shift:both_capslock   Both Shift together enable Caps Lock
      - setxkbmap -layout us -option 'compose:caps' -option 'terminate:ctrl_alt_bksp' -option 'ctrl:menu_rctrl'

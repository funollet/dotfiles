# https://taskfile.dev
#
# System packages: rpm lists via dnf, and the fusuma gems.

version: "3"

vars:
  # rpm package lists, kept with the rest of the machine setup under mise.
  PACKAGES: "{{.ROOT_DIR}}/mise/.config/mise/dnf-packages.yml"

tasks:
  dnf:
    desc: Converge rpm packages from dnf-packages.yml.
    cmds:
      - task: dnf-remove
      - task: dnf-install
      - task: mscorefonts

  dnf-install:
    desc: Install the dnf_install list from dnf-packages.yml.
    vars:
      PKGS:
        sh: yq -r '.dnf_install | join(" ")' {{.PACKAGES}}
    cmds:
      - sudo dnf install -y {{.PKGS}}

  dnf-remove:
    desc: Remove the dnf_remove list from dnf-packages.yml.
    vars:
      PKGS:
        sh: yq -r '.dnf_remove | join(" ")' {{.PACKAGES}}
    cmds:
      # Packages already gone are "Nothing to do" for dnf5, not an error.
      - sudo dnf remove -y {{.PKGS}}

  mscorefonts:
    desc: Install the Microsoft core fonts installer rpm.
    vars:
      RPM: msttcore-fonts-installer-2.6-1.noarch.rpm
      URL: https://downloads.sourceforge.net/project/mscorefonts2/rpms/{{.RPM}}
    # The rpm was built in 2013 with rpm 4.10 and carries no header or payload
    # digest, so today's rpm (%_pkgverify_level digest) refuses it and dnf has
    # no per-package override. It is installed with plain rpm and --nodigest
    # instead, after dnf-install has put its dependencies in place. --nodigest
    # only skips the digest check on this one transaction.
    status:
      - rpm -q msttcore-fonts-installer
    cmds:
      - curl -fsSL -o /tmp/{{.RPM}} {{.URL}}
      - sudo rpm -i --nodigest /tmp/{{.RPM}}
      - rm -f /tmp/{{.RPM}}

  fusuma:
    desc: Install fusuma and its plugins as user gems.
    vars:
      GEMS: fusuma fusuma-plugin-keypress fusuma-plugin-tap fusuma-plugin-sendkey
    cmds:
      # --conservative keeps whatever already satisfies the requirement, so
      # rerunning is a no-op instead of an upgrade.
      # fusuma.service is stowed from the fusuma package and enabled by
      # "task dotfiles:systemctl", like every other user unit.
      - gem install --user-install --conservative --no-document {{.GEMS}}

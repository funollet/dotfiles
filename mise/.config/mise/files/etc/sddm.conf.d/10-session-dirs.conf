# Managed by mise bootstrap (.config/mise/files). Do not edit here.
#
# Pins sddm's session search order so the local override in
# /usr/local/share/xsessions/qtile.desktop shadows the packaged one (see the
# comment in that file). This is sddm 0.21's built-in default, but Fedora's
# /etc/sddm.conf template only shows the last directory, so the order is
# stated here rather than relied on.

[X11]
SessionDir=/usr/local/share/xsessions,/usr/share/xsessions

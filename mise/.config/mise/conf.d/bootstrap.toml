[bootstrap.hooks.pre-packages]
run = [
  # mise has no flatpak remote management and Fedora ships without flathub.
  # --if-not-exists keeps the hook idempotent; system remotes go through
  # polkit, like the installs below.
  "flatpak remote-add --if-not-exists --system flathub https://flathub.org/repo/flathub.flatpakrepo",
]

# Groups for the udev rules above: uinput for kmonad and the like, plugdev
# for ZSA keyboard flashing. /dev/uinput itself is not declared here; the
# 98-uinput.rules entry owns its group and mode at every boot.
[bootstrap.groups.uinput]
[bootstrap.groups.plugdev]

# Only supplementary memberships are managed; everything else about the
# account stays as it is.
[bootstrap.users.jordif]
group = "jordif"
groups = ["wheel", "dialout", "input", "uinput", "docker", "plugdev"]

[bootstrap.packages]
# System-wide flatpaks from flathub. Deliberately unpinned: a version pin
# makes mise run `flatpak install id@version`, which flatpak rejects
# ("Name can't contain @"). Flatpak tracks branches, not versions.
"flatpak:com.bambulab.BambuStudio" = "latest"
"flatpak:com.bitwarden.desktop" = "latest"
"flatpak:com.discordapp.Discord" = "latest"
"flatpak:com.github.ransome1.sleek" = "latest"
"flatpak:com.rafaelmardojai.Blanket" = "latest"
"flatpak:com.slack.Slack" = "latest"
"flatpak:com.spotify.Client" = "latest"
"flatpak:com.usebottles.bottles" = "latest"
"flatpak:com.valvesoftware.Steam" = "latest"
"flatpak:md.obsidian.Obsidian" = "latest"
"flatpak:net.ankiweb.Anki" = "latest"
"flatpak:org.freecad.FreeCAD" = "latest"
"flatpak:org.telegram.desktop" = "latest"
"flatpak:us.zoom.Zoom" = "latest"

[bootstrap.files]
# Fedora's stock dnf.conf plus defaultyes, so dnf prompts default to yes.
"/etc/dnf/dnf.conf" = { source = "../files/etc/dnf/dnf.conf" }
"/etc/X11/xorg.conf.d/30-touchpad.conf" = { source = "../files/etc/X11/xorg.conf.d/30-touchpad.conf" }
"/etc/X11/xinit/xinitrc.d/40-ssh-agent-socket.sh" = { source = "../files/etc/X11/xinit/xinitrc.d/40-ssh-agent-socket.sh" }
# Executable, unlike its 40-ssh-agent-socket.sh sibling: Fedora's default
# SessionCommand runs the xinitrc-common loop, which sources every file
# regardless of mode, but sddm's own Xsession script tests for -x first.
"/etc/X11/xinit/xinitrc.d/50-qtile-desktop.sh" = { source = "../files/etc/X11/xinit/xinitrc.d/50-qtile-desktop.sh", mode = "0755" }
# udev rules. A change reloads udevd, which is what `udevadm control --reload`
# does under the hood.
"/etc/udev/rules.d/50-wally.rules" = { source = "../files/etc/udev/rules.d/50-wally.rules", notify = [
  "systemd-udevd",
] }
"/etc/udev/rules.d/98-uinput.rules" = { source = "../files/etc/udev/rules.d/98-uinput.rules", notify = [
  "systemd-udevd",
] }

# Declared only as the reload target for the udev rules above. The unit is
# static: enabled = true would never be satisfied, enabled = false is.
[bootstrap.services.systemd-udevd]
state = "running"
enabled = false
on_change = "reload"
